<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="100%" height="100%">
  <defs>
    <!-- Background Radial Depth -->
    <radialGradient id="lkRadarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#131F30" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0E1522" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070B12" stop-opacity="1" />
    </radialGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="lkCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#20E3F2" />
      <stop offset="70%" stop-color="#4287FF" />
      <stop offset="100%" stop-color="#8964FF" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="lkGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem Mark (Group centered around x=36, y=36, scaled) -->
  <g transform="translate(4, 4) scale(0.64)">
    <!-- Outer Circular Base -->
    <circle cx="50" cy="50" r="46" fill="url(#lkRadarBg)" stroke="#293A50" stroke-width="1.8" />
    <circle cx="50" cy="50" r="38" fill="none" stroke="#1B283A" stroke-width="1" stroke-dasharray="2 3" />
    <circle cx="50" cy="50" r="28" fill="none" stroke="#223348" stroke-width="1" />
    <circle cx="50" cy="50" r="18" fill="none" stroke="#293A50" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Cardinal Ticks -->
    <line x1="50" y1="4" x2="50" y2="14" stroke="#20E3F2" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="86" x2="50" y2="96" stroke="#20E3F2" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="50" x2="14" y2="50" stroke="#20E3F2" stroke-width="2" stroke-linecap="round" />
    <line x1="86" y1="50" x2="96" y2="50" stroke="#20E3F2" stroke-width="2" stroke-linecap="round" />

    <!-- Radar Eye Aperture -->
    <path d="M12 50 C26 26, 74 26, 88 50 C74 74, 26 74, 12 50 Z"
          fill="rgba(20, 34, 54, 0.45)"
          stroke="url(#lkCyanGrad)"
          stroke-width="2.4"
          stroke-linejoin="round"
          filter="url(#lkGlow)" />

    <!-- Iris Ring -->
    <circle cx="50" cy="50" r="14" fill="none" stroke="#20E3F2" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Pulse Waveform -->
    <path d="M14 50 L32 50 L37 36 L43 64 L49 26 L55 70 L61 40 L66 50 L86 50"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#lkGlow)" />

    <circle cx="49" cy="26" r="2.5" fill="#20E3F2" />
    <circle cx="55" cy="70" r="2.2" fill="#FF667A" />
    <circle cx="50" cy="50" r="3.4" fill="#FFFFFF" />
  </g>

  <!-- Typography: THREATPULSE -->
  <text x="82" y="38" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="1.5" fill="#EAF2FF">
    THREAT<tspan fill="#20E3F2" filter="url(#lkGlow)">PULSE</tspan>
  </text>

  <!-- Subtitle Metadata & Live Badge -->
  <text x="83" y="55" font-family="'JetBrains Mono', 'Inter', monospace" font-weight="600" font-size="9.5" letter-spacing="1.2" fill="#92A4BC">
    3D CYBER COMMAND CENTER
  </text>
  
  <circle cx="270" cy="52" r="3" fill="#42D6A4" />
  <text x="278" y="55" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="9" letter-spacing="1" fill="#42D6A4">
    LIVE
  </text>
</svg>
