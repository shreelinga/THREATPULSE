<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Standalone Monochrome Radar Eye Variation -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="2 3" />
  <circle cx="50" cy="50" r="28" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.5" />
  <circle cx="50" cy="50" r="18" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3" />

  <!-- Cardinal Ticks -->
  <line x1="50" y1="4" x2="50" y2="14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="86" x2="50" y2="96" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <line x1="4" y1="50" x2="14" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <line x1="86" y1="50" x2="96" y2="50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

  <!-- Radar Eye Outline -->
  <path d="M12 50 C26 26, 74 26, 88 50 C74 74, 26 74, 12 50 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.4"
        stroke-linejoin="round" />

  <!-- Pulse Waveform -->
  <path d="M14 50 L32 50 L37 36 L43 64 L49 26 L55 70 L61 40 L66 50 L86 50"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <circle cx="49" cy="26" r="2.5" fill="#FFFFFF" />
  <circle cx="55" cy="70" r="2.2" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="3.4" fill="#FFFFFF" />
</svg>
